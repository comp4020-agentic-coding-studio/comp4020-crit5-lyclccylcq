<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pip's Detour</title>
    <meta
      name="description"
      content="A tiny two-minute browser platformer with a few surprises along the way."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <div class="brand">
          <h1 class="logo">Pip's Detour</h1>
        </div>
        <div class="nav-controls">
          <a href="./">Home</a>
          <div class="level-select" id="level-select" role="group" aria-label="Choose level">
            <button type="button" data-level="1" aria-pressed="true">Level 1</button>
            <button type="button" data-level="2" aria-pressed="false">Level 2</button>
          </div>
          <div class="music-controls" id="music-controls" role="group" aria-label="Background music">
            <button type="button" data-music-toggle aria-pressed="false" aria-label="Play music" title="Play music">▶</button>
            <input
              type="range"
              data-music-volume
              min="0"
              max="1"
              step="0.01"
              value="0.5"
              aria-label="Music volume"
            />
            <button type="button" data-music-mute aria-pressed="false" aria-label="Mute music" title="Mute music">🔊</button>
          </div>
          <span id="death-count" class="death-count">Deaths: 0</span>
        </div>
      </nav>
    </header>
    <main>
      <canvas id="game" aria-label="Pip's Detour game canvas"></canvas>
      <div id="completion-card" class="completion-card" role="dialog" aria-label="Game complete" hidden>
        <div class="completion-card-inner">
          <h2>You cleared Pip's Detour</h2>
          <p data-completion-deaths></p>
          <div class="completion-actions">
            <a href="./" data-completion-home class="completion-home">Home</a>
            <button type="button" data-completion-play-again>Play Again</button>
          </div>
        </div>
      </div>
    </main>
    <!-- Page-level background music — see game/audio.ts. -->
    <audio id="bg-music" preload="auto">
      <source src="./audio/background-music.mp3" type="audio/mpeg" />
    </audio>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
